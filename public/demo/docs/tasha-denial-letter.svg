<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800" role="img" aria-label="Sample denial letter"><rect width="600" height="800" fill="#ffffff"/><text x="30" y="50" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#22425c" text-anchor="start">Summit Peak Health Plan</text><text x="30" y="72" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52606d" text-anchor="start">Appeals and Grievances, PO Box 0177, Fairhaven, OH 43000 (made up)</text><text x="30" y="90" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52606d" text-anchor="start">Fax: (614) 555-0177</text><text x="30" y="140" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2933" text-anchor="start">Date: October 6, 2026</text><text x="30" y="170" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start">Tasha Brooks</text><text x="30" y="188" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start">Member ID: SPH-000-118-204 (sample)</text><text x="30" y="206" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start">Plan: Fairview Schools Employee Health Plan</text><text x="30" y="244" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#22425c" text-anchor="start">Notice of claim denial</text><text x="30" y="272" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start">Service: MRI of the knee without contrast (code 73721), done 09/22/2026</text><text x="30" y="290" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start">Ordered by: Dr. Anita Rao, Lakeside Orthopedics</text><text x="30" y="308" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start">Billed: $2,100.00    Plan paid: $0.00</text><text x="30" y="344" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2933" text-anchor="start">Decision: Denied. Reason code CO-50.</text><text x="30" y="364" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start">The plan considers this service not medically necessary based on the</text><text x="30" y="382" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start">records received. The records did not show at least 6 weeks of</text><text x="30" y="400" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start">conservative treatment, such as physical therapy, before imaging.</text><text x="30" y="440" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#22425c" text-anchor="start">Your appeal rights</text><text x="30" y="466" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start">You may ask us to review this decision. Your appeal must be received</text><text x="30" y="484" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2933" text-anchor="start">within 180 days of the date of this letter.</text><text x="30" y="512" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start">If we uphold the denial, you may ask for an external review by an</text><text x="30" y="530" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start">independent review organization. Send your appeal to the address above.</text><text x="30" y="580" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52606d" text-anchor="start">Summit Peak Health Plan, Utilization Review</text><text x="30" y="760" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#7b8794" text-anchor="start">Sample document for the Arik Health demo. Fictional member, plan and insurer.</text><text x="300.0" y="400.0" font-family="Helvetica, Arial, sans-serif" font-size="100" font-weight="700" fill="#b3362f" fill-opacity="0.07" text-anchor="middle" transform="rotate(-30 300.0 400.0)">SAMPLE</text><rect x="482" y="12" width="104" height="24" rx="12" fill="#b3362f"/><text x="534" y="29" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">SAMPLE</text></svg>
